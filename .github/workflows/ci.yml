name: ci

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Na main não cancela: o release espera o resultado deste workflow (release.yml)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.21"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run bandit -c pyproject.toml -q -r src
      # Fuso diferente do de produção, de propósito (padrão §5.5, regra 8)
      - run: uv run pytest --cov=stur_api --cov-report=term-missing
        env:
          TZ: UTC

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      # semgrep roda isolado (uvx): ele conflita com o fastapi no ambiente do projeto
      - run: >-
          uvx --from semgrep==1.165.0 semgrep --error --skip-unknown-extensions
          --config p/security-audit --config p/secrets

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1" # a mesma do gancho do pre-commit

  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --no-dev
      # O openapi.json versionado tem de ser o que o código gera (o frontend gera tipos dele)
      - run: uv run --frozen --no-dev python -m stur_api.openapi_export | diff - openapi.json

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: stur-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Subir a imagem e consultar a saúde
        run: |
          docker run -d --name stur-api-ci -p 8000:8000 \
            -e STUR_API_URL=https://agi.exemplo.invalid \
            -e STUR_API_USUARIO=u -e STUR_API_SENHA=s stur-api:ci
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/v1/saude && exit 0
            sleep 1
          done
          docker logs stur-api-ci
          exit 1
