# Configuração do SonarQube. O token NÃO fica aqui (repositório público):
# use a variável SONAR_TOKEN (veja scripts/sonar.sh).
sonar.host.url=https://sonar.pedroct.com.br
sonar.projectKey=stur-consulta
sonar.projectName=stur-consulta

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# Gerado por: uv run pytest --cov=stur_api --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Código gerado a partir do contrato da AGI (scripts/gerar_modelos.py) e fixtures
sonar.cpd.exclusions=src/stur_api/agi/modelos.py
